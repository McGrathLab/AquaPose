name: Release

# Automated versioning is retired as of the v4.0 Publication milestone.
#
# python-semantic-release previously ran on every push to main and dev. That
# rewrote pyproject.toml's version from commit history, which conflicts with
# the deliberate 4.0.0 version reset and, on main, would have cut a tag matching
# publish.yml's trigger and published an unintended version to PyPI (immutable).
#
# Release tags are now created deliberately as annotated tags (`git tag -a vX.Y.Z`).
# Pushing such a tag fires publish.yml, which remains the PyPI path.
#
# This workflow is kept for manual invocation only.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    concurrency: release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install python-semantic-release and build
        run: pip install python-semantic-release build

      - name: Semantic release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          semantic-release version
